# Reference copy of the fail2ban filter for diytracker failed logins.
# The live file is /etc/fail2ban/filter.d/diytracker-login.conf on the box.
#
# Matches the warning written by diytracker/blueprints/auth.py to
# logs/error_log_diytracker (gunicorn errorlog):
#   [2026-07-02 22:08:18,095] WARNING in auth: Failed login attempt for 'x@y.z' from 178.192.171.86
# The IP is the real client address: ProxyFix (diytracker/app.py) trusts the
# one X-Forwarded-For hop nginx adds, and gunicorn only listens on localhost.
#
# Install:
#   sudo cp deploy/fail2ban-diytracker-filter.conf /etc/fail2ban/filter.d/diytracker-login.conf
# Test against the real log before enabling the jail:
#   sudo fail2ban-regex /home/diytrackeruser/diytracker/logs/error_log_diytracker \
#       /etc/fail2ban/filter.d/diytracker-login.conf

[Definition]
# The email is attacker-controlled but logged via %r (repr), so it can't
# contain a newline. The greedy .+ plus the end-of-line anchor make <HOST>
# bind to the *last* "from <ip>" on the line, so an email crafted to look
# like "x' from 1.2.3.4" can't spoof the banned address.
failregex = ^\s*WARNING in auth: Failed login attempt for .+ from <HOST>\s*$

ignoreregex =
