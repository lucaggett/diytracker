# Reference copy of the nginx site config. The live file is
# /etc/nginx/sites-available/diytracker on the box and is what actually
# runs — apply changes there by hand and keep the two in sync:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keep this reference free of anything secret. The current contents are
# safe to publish (standard paths, localhost upstream, no credentials) —
# but if the live config ever grows basic-auth, allowlisted IPs, tokens or
# similar, leave those OUT of this copy.
#
# ACME note: port 80 redirects everything, which is fine with certbot's
# nginx plugin (it injects its own temporary config for renewals). If you
# switch to webroot renewal, add an exception for /.well-known/acme-challenge/
# before the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name diytracker.ch www.diytracker.ch;
    return 301 https://diytracker.ch$request_uri;
}

# https://www → https apex. Without this block the apex server below is the
# default for 443 and serves the full site under the www hostname — a
# duplicate-content origin that fights the canonical tags. The cert must
# cover www.diytracker.ch (certbot --expand -d diytracker.ch -d www.diytracker.ch
# if it doesn't yet).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.diytracker.ch;

    ssl_certificate     /etc/letsencrypt/live/diytracker.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diytracker.ch/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://diytracker.ch$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diytracker.ch;

    ssl_certificate     /etc/letsencrypt/live/diytracker.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diytracker.ch/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Don't advertise the exact nginx version to scanners.
    server_tokens off;

    # ── Security headers ─────────────────────────────────────────────────────
    # The app sets these itself (diytracker/services/security.py) for
    # everything it renders, so they are NOT repeated here — duplicating them
    # would emit each header twice. This block only covers /static/, which
    # nginx serves without ever reaching gunicorn.
    location /static/ {
        alias /home/diytrackeruser/diytracker/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    # Brotli for modern clients; gzip fallback. Brotli requires the
    # ngx_brotli module — on Debian/Ubuntu:
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # If unavailable, comment the brotli_* lines out; gzip alone is fine.
    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml
        application/javascript application/json application/xml+rss
        image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml+rss
        image/svg+xml;

    # Static files are served directly by nginx and never hit gunicorn (see
    # the /static/ block above). That is also what keeps the offline error
    # page below, and its fonts, working while the app is down.

    # Treat the favicon the same way (it's at /favicon.ico, not /static/)
    location = /favicon.ico {
        alias /home/diytrackeruser/diytracker/static/favicon.ico;
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── App-down error page ──────────────────────────────────────────────────
    # When gunicorn is unreachable (502) or hung/overloaded (503/504), serve
    # the self-contained zine-styled page instead of nginx's default white
    # error. Only nginx-generated errors are intercepted: app-rendered
    # 404/500 pages pass through untouched (proxy_intercept_errors is off).
    error_page 502 503 504 /errors/offline.html;
    location = /errors/offline.html {
        root /home/diytrackeruser/diytracker/static;
        internal;
    }

    # ── Everything else → Gunicorn on 127.0.0.1:8080 ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cap upload size to match Flask's MAX_CONTENT_LENGTH (5 MB)
    client_max_body_size 5m;
}
