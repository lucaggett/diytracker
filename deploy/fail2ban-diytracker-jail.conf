# Reference copy of the fail2ban jails for the diytracker box.
# The live file is /etc/fail2ban/jail.d/diytracker.local on the box.
#
# Install (filter first — see fail2ban-diytracker-filter.conf):
#   sudo apt install fail2ban
#   sudo cp deploy/fail2ban-diytracker-jail.conf /etc/fail2ban/jail.d/diytracker.local
#   sudo systemctl restart fail2ban
# Verify:
#   sudo fail2ban-client status
#   sudo fail2ban-client status diytracker-login
# Unban a locked-out IP:
#   sudo fail2ban-client set diytracker-login unbanip <ip>

[sshd]
# Debian ships this jail disabled by default; auth.log exists on Debian 12 so
# the stock filter/backend work as-is.
enabled = true

[diytracker-login]
enabled  = true
filter   = diytracker-login
logpath  = /home/diytrackeruser/diytracker/logs/error_log_diytracker
# Flask-Limiter already caps POST /login at 10/min per IP; this bans the IPs
# that keep hammering anyway. 5 failures in 10 minutes → 1 h ban, doubling on
# repeat offenses up to a week.
maxretry = 5
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.maxtime   = 1w
