{# Public header. Banner image sits on a dark bg so its edges blend in.
   Nav is reversed (paper text on ink) to stay in the dark zone. #}
<header class="relative">
  <a href="{{ url_for('public.calendar_view') }}" class="block">
    <img src="{{ url_for('static', filename='img/banner.webp') }}"
         alt="diytracker — DIY concerts in Switzerland"
         width="1600" height="407"
         class="block w-full h-auto"
         fetchpriority="high">
  </a>
  <svg class="w-full block" viewBox="0 0 100 10" preserveAspectRatio="none" style="height:10px" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L100,0 L100,7 L96,5 L90,9 L82,6 L76,10 L68,6 L62,9 L54,5 L48,8 L40,3 L34,7 L26,4 L20,8 L14,5 L8,9 L4,6 L0,8 Z" fill="var(--ink)"/>
  </svg>
  <div class="max-w-3xl mx-auto px-4 pb-4">
    <nav class="mt-4 flex flex-wrap justify-center gap-x-5 gap-y-2 font-mono text-xs uppercase tracking-wider">
      <a href="{{ url_for('public.calendar_view') }}" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150">{{ _('Calendar') }}</a>
      <a href="{{ url_for('public.venue_map') }}" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150">{{ _('Map') }}</a>
      {% if session.get('user_id') %}
        <a href="{{ url_for('admin.admin') }}" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150">{{ _('Admin') }}</a>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150 font-mono text-xs uppercase tracking-wider cursor-pointer">{{ _('Logout') }}</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150">{{ _('Login') }}</a>
      {% endif %}
      <a href="{{ url_for('public.about') }}" class="hover:text-bleed underline-offset-4 hover:underline transition-colors duration-150">{{ _('About') }}</a>
    </nav>
  </div>
</header>
