{# Accessibility call-to-action for a venue. Context: venue. #}
<div class="mt-8">
  {% if venue.accessibility %}
  <a href="{{ url_for('public.venue_accessibility', venue_id=venue.id) }}"
     class="btn-press inline-block font-mono text-xs uppercase tracking-widest border-2 border-ink bg-ink text-paper px-4 py-2 hover:bg-bleed transition-colors">
    {{ _('View accessibility info') }}
  </a>
  {% else %}
  <p class="text-xs text-smudge">
    {{ _('No accessibility info for this venue yet.') }}
    <a href="{{ url_for('public.about') }}"
       class="text-bleed underline">{{ _('Contact us if you have details.') }}</a>
  </p>
  {% endif %}
</div>
