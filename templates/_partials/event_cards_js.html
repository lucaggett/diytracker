{# Behavior for _partials/event_cards.html: expand/collapse + share buttons.
   Also drives the copy button in _partials/subscribe_calendar.html, which
   appears on the same pages. Include once in the page's scripts block. #}
<script nonce="{{ csp_nonce() }}">
    document.addEventListener("DOMContentLoaded", function () {
        window.toggleEventDetails = function (element) {
            element.classList.toggle('is-open');
        }

        // Share buttons: native share sheet where available, clipboard copy
        // otherwise. Without JS the anchor simply navigates to the event page.
        document.querySelectorAll('.share-event-btn').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation(); // keep the card from collapsing
                if (navigator.share) {
                    e.preventDefault();
                    navigator.share({ title: btn.dataset.shareTitle, url: btn.href }).catch(function () {});
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    e.preventDefault();
                    navigator.clipboard.writeText(btn.href).then(function () {
                        const label = btn.querySelector('.share-label');
                        const original = label.textContent;
                        label.textContent = btn.dataset.copiedLabel;
                        setTimeout(function () { label.textContent = original; }, 1500);
                    });
                }
            });
        });

        // Subscription copy button: the webcal:// link next to it covers the
        // common case, this covers clients that only take a pasted URL.
        document.querySelectorAll('.copy-ics-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (!(navigator.clipboard && navigator.clipboard.writeText)) return;
                navigator.clipboard.writeText(btn.dataset.link).then(function () {
                    const original = btn.textContent;
                    btn.textContent = '✓';
                    setTimeout(function () { btn.textContent = original; }, 1500);
                });
            });
        });
    });
</script>
