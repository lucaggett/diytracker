{# Link from a backstage page to its section of the help page.
   Context: help_anchor (required, an id in templates/help/help_<lang>.html),
   help_text (optional, defaults to "How to use this page"). #}
<a href="{{ url_for('public.help_page') }}#{{ help_anchor }}"
   class="text-xs uppercase tracking-widest text-smudge hover:text-bleed whitespace-nowrap">
  {{ (help_text if help_text is defined else _('How to use this page')) }} →
</a>
