<!DOCTYPE html>
<html lang="{{ (g.get('locale', 'de') if g else 'de') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin · diytracker.ch{% endblock %}</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-paper text-ink font-mono min-h-screen flex flex-col">

  {% include '_partials/nav_admin.html' %}

  {% with variant = 'admin' %}{% include '_partials/flash.html' %}{% endwith %}

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
