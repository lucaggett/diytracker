<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Approve Scraped Events</title>
    <!-- Include Tailwind CSS via CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold mb-6">Approve Scraped Events</h1>
        {% if events %}
        <table class="min-w-full bg-white shadow-md rounded">
            <thead>
                <tr>
                    <th class="py-2 px-4 border-b">Date</th>
                    <th class="py-2 px-4 border-b">Event</th>
                    <th class="py-2 px-4 border-b">Venue</th>
                    <th class="py-2 px-4 border-b">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for event in events %}
                <tr class="text-center">
                    <td class="py-2 px-4 border-b">{{ event.start_date }}</td>
                    <td class="py-2 px-4 border-b">{{ event.title or event.performers }}</td>
                    <td class="py-2 px-4 border-b">{{ event.venue_name }}, {{ event.city }}</td>
                    <td class="py-2 px-4 border-b">
                        <form method="post" class="inline">
                            <input type="hidden" name="index" value="{{ loop.index0 }}">
                            <button type="submit" class="text-blue-500 hover:underline">Approve</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>No scraped events available for approval.</p>
        {% endif %}
    </div>
</body>
</html>
