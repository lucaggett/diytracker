name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov=diytracker --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      # --output-format=github turns findings into inline PR annotations
      # instead of burying them in the job log.
      - name: ruff check
        run: uv run ruff check --output-format=github .

      # Formatting is a *gate* on pull requests. It used to be enforced only
      # by the auto-commit job below, which is skipped for forks -- so a fork
      # PR with unformatted code passed CI clean. Pushes to main are still
      # auto-formatted rather than rejected.
      - name: ruff format --check
        if: github.event_name == 'pull_request'
        run: uv run ruff format --check --diff .

  format:
    name: Format (auto-commit on main)
    runs-on: ubuntu-latest
    # Only pushes to main auto-format. PRs are gated by the lint job instead:
    # pushing to a contributor's branch needs write access we don't have on
    # forks, and the push would not re-trigger CI anyway.
    if: github.event_name == 'push'
    # Never lay a formatting commit on top of a red commit.
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # default GITHUB_TOKEN, but explicit so the later push works
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff format
        run: uv run ruff format .

      - name: Commit and push formatting fixes
        # Note: this push does not re-trigger CI (pushes made with
        # GITHUB_TOKEN never do). That is acceptable only because the commit
        # it lands on already passed `test` and `lint` via `needs:` above,
        # and `ruff format` changes layout, never behaviour.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already formatted, nothing to commit."
            exit 0
          fi
          RUFF_VERSION="$(uv run ruff --version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-format with ${RUFF_VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"

  i18n:
    name: i18n (translation status)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check translation status
        run: uv run python scripts/i18n_status.py

  tailwind:
    name: Build (Tailwind CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --minify to match the documented local command (README / CLAUDE.md);
      # a build with different flags produces a different file and could never
      # be compared against the committed one.
      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./static/css/styles.css -o ./static/css/output.css --minify

      # static/css/output.css is committed and served straight to visitors, so
      # a template change without a rebuild silently ships stale CSS. Building
      # alone never caught that — the diff is the actual check.
      - name: Check the committed CSS is up to date
        run: |
          if ! git diff --quiet -- static/css/output.css; then
            echo "::error::static/css/output.css is stale. Rebuild it with:"
            echo "  npx @tailwindcss/cli -i ./static/css/styles.css -o ./static/css/output.css --minify"
            git diff --stat -- static/css/output.css
            exit 1
          fi
