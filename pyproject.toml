[project]
name = "diytracker"
version = "0.11.2"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "flask-babel>=4.0",
    "flask-compress>=1.15",
    "flask-caching>=2.3",
    "gunicorn>=23.0",
    "python-dateutil>=2.9",
    "brotli>=1.1",
    "python-dotenv>=1.0",
    "email-validator>=2.1",
    "openpyxl>=3.1",
    "pillow>=9.5",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Library + app-code deprecations (utcnow, legacy Query.get) — out of scope
    # for the test suite; silence so real warnings stay visible.
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.LegacyAPIWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
